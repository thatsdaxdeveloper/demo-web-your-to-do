<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport"
            content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link href="/src/style.css" rel="stylesheet">
  </head>
  <body class="min-h-screen bg-gray-50 flex justify-center items-center">
    <div class="mx-6 flex h-[80vh] flex-col py-8 lg:mx-auto lg:w-1/3">
      <header class="shrink-0">
        <h1 class="text-3xl lg:text-4xl font-bold text-gray-800">Your To Do</h1>

        <form id="todo-form" class="flex mt-6 lg:mt-6">
          <label for="todo-input"></label>
          <input type="text" id="todo-input" placeholder="Add new task"
                  class="border-b-2 lg:border-b-4 w-full mr-6 border-gray-400 placeholder:text-sm lg:placeholder:text-xl focus:outline-none text-gray-800">
          <button id="todo-button" class="bg-gray-800 p-2 lg:p-4 rounded-md lg:rounded-xl">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                    class="lg:w-6 lg:h-6 w-4 h-4 text-white"><title>add</title>
              <path fill="currentColor" d="M11 13H5v-2h6V5h2v6h6v2h-6v6h-2z"/>
            </svg>
          </button>
        </form>
      </header>

      <ul id="todo-list" class="mt-8 overflow-y-auto">
      </ul>

      <footer class="sticky bottom-0 pt-6">
        <h3 id="remaining-todos" class="text-md lg:text-xl text-gray-800 italic mb-2"></h3>
        <p class="text-gray-400 text-sm lg:text-xl italic">“Doinbg what you love is the cornestone of having adundance
          in your life.” — Wayne Dyer</p>
      </footer>

    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
