<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport"
            content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link href="/src/style.css" rel="stylesheet">
  </head>
  <body class="bg-gray-50 flex min-h-screen items-center justify-center">
    <div class="w-full mx-6 lg:w-1/3">
      <header>
      <h1 class="text-2xl lg:text-4xl font-bold text-gray-800">Your To Do</h1>
      </header>

      <form id="todo-form" class="flex mt-4 lg:mt-6">
        <label for="todo-input"></label>
        <input type="text" id="todo-input" placeholder="Add new task"
                class="border-b-2 lg:border-b-4 w-full mr-6 border-gray-400 placeholder:text-sm lg:placeholder:text-xl focus:outline-none text-gray-800">
        <button id="todo-button" class="bg-gray-800 p-2 lg:p-4 rounded-md lg:rounded-xl">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                  class="lg:w-6 lg:h-6 w-4 h-4 text-white"><title>add</title>
            <path fill="currentColor" d="M11 13H5v-2h6V5h2v6h6v2h-6v6h-2z"/>
          </svg>
        </button>
      </form>

      <ul id="todo-list" class="mt-6 lg:mt-8">
      </ul>

      <div class="w-md mt-6">
        <h3 id="remaining-todos" class="text-2xl text-gray-800 italic mb-4"></h3>
        <p class="text-gray-400 text-xl italic">“Doinbg what you love is the cornestone of having adundance in your
          life.” —
          Wayne Dyer</p>
      </div>

    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
